<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Meta tags para tela cheia nativa no iPhone (Adicionar à Tela de Início) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Teleprompter Pro</title>
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --highlight-color: #fbbf24; 
            --dim-color: #4b5563; 
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            touch-action: manipulation; 
        }

        /* --- TELA DE CONFIGURAÇÃO --- */
        #setup-screen {
            background-color: #1a1a1a;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
        }

        .setup-container {
            background: #2a2a2a;
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 800px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        h1 { margin-top: 0; text-align: center; }

        textarea {
            width: 100%;
            height: 300px;
            padding: 15px;
            background: #111;
            color: #fff;
            border: 1px solid #444;
            border-radius: 8px;
            font-size: 16px;
            resize: vertical;
            margin-bottom: 20px;
        }

        .controls-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
            background: #1f1f1f;
            padding: 15px;
            border-radius: 8px;
        }

        .control-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            width: 100%;
        }

        input[type="range"] {
            flex-grow: 1;
            cursor: pointer;
            height: 6px;
            background: #444;
            border-radius: 5px;
            outline: none;
            -webkit-appearance: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--highlight-color);
            cursor: pointer;
        }

        .slider-display {
            width: 80px;
            text-align: right;
            font-weight: bold;
            font-size: 16px;
            color: var(--highlight-color);
        }

        input[type="checkbox"] { width: 24px; height: 24px; cursor: pointer; }

        .btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 15px 24px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            font-weight: bold;
            width: 100%;
        }

        .btn:hover { background: #1d4ed8; }

        /* --- TELA DO TELEPROMPTER --- */
        #teleprompter-screen {
            display: none;
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow-y: auto; /* Correção: Permite que a tela do prompter role */
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        #text-container {
            padding: 50vh 10% 50vh 10%; 
            font-size: 80px; 
            line-height: 1.4;
            font-weight: bold;
            text-align: center;
            transition: transform 0.3s;
            direction: ltr; 
            cursor: pointer; 
            /* Removido o height: 100% que estava travando a rolagem */
        }

        .word {
            color: var(--dim-color);
            transition: color 0.1s;
            display: inline-block;
            margin-right: 15px;
        }

        .word.active {
            color: var(--highlight-color);
            text-shadow: 0 0 10px rgba(251, 191, 36, 0.3);
        }

        .word.read { color: var(--text-color); }

        .mirror-x { transform: scaleX(-1); }
        .mirror-y { transform: scaleY(-1); }
        .mirror-xy { transform: scaleX(-1) scaleY(-1); }

        /* --- CONTROLES FLUTUANTES --- */
        #floating-controls {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(0,0,0,0.85);
            padding: 12px 20px;
            border-radius: 8px;
            border: 1px solid #444;
            flex-wrap: wrap;
            justify-content: flex-end;
            max-width: 90vw;
            transition: opacity 0.3s, transform 0.3s;
        }

        .float-slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
            border-right: 1px solid #555;
            padding-right: 15px;
        }

        .float-btn {
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
        }
        .float-btn:hover { background: #555; }
        
        .play-btn { background: #059669; border-color: #047857; min-width: 140px; }
        .play-btn:hover { background: #047857; }
        
        .fs-btn { background: #6366f1; border-color: #4f46e5; }
        .fs-btn:hover { background: #4f46e5; }
        
        #status-indicator {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.85);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            color: #fbbf24;
            z-index: 1000;
            border: 1px solid #444;
            transition: opacity 0.3s, transform 0.3s;
        }

        /* --- BOTAO OLHO PARA OCULTAR --- */
        #eye-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.6);
            border: 1px solid #555;
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            z-index: 1001;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            transition: opacity 0.3s;
        }

        #eye-btn:hover { background: rgba(0,0,0,0.9); }

        .ui-hidden {
            opacity: 0;
            pointer-events: none;
            transform: translateY(-20px);
        }
        
        .eye-dimmed {
            opacity: 0.2;
        }

        @media (max-width: 768px) {
            #floating-controls { top: auto; bottom: 80px; justify-content: center; }
            .float-slider-container { border: none; width: 100%; justify-content: space-between; }
            #status-indicator { top: auto; bottom: 20px; left: 20px; }
        }
    </style>
</head>
<body>

    <!-- TELA 1: CONFIGURAÇÃO -->
    <div id="setup-screen">
        <div class="setup-container">
            <h1>Teleprompter</h1>
            <p>Cole o roteiro abaixo:</p>
            <textarea id="input-text" placeholder="Cole o texto..."></textarea>
            
            <div class="controls-group">
                <div class="control-row">
                    <label>Velocidade:</label>
                    <input type="range" id="setup-speed-slider" min="50" max="300" value="130">
                    <span id="setup-speed-display" class="slider-display">130 PPM</span>
                </div>
                
                <div class="control-row">
                    <label>Tamanho Letra:</label>
                    <input type="range" id="setup-font-slider" min="40" max="150" value="80">
                    <span id="setup-font-display" class="slider-display">80px</span>
                </div>
                
                <hr style="width: 100%; border: 1px solid #333; margin: 5px 0;">
                
                <div class="control-row" style="justify-content: flex-start;">
                    <input type="checkbox" id="mirror-x">
                    <label for="mirror-x">Espelhar Horizontal (Esquerda/Direita)</label>
                </div>
                <div class="control-row" style="justify-content: flex-start;">
                    <input type="checkbox" id="mirror-y" checked>
                    <label for="mirror-y">Espelhar Vertical (Cabeça para baixo)</label>
                </div>
            </div>

            <button class="btn" onclick="startTeleprompter()">Iniciar Teleprompter</button>
        </div>
    </div>

    <!-- TELA 2: TELEPROMPTER -->
    <div id="teleprompter-screen">
        <div id="status-indicator">PAUSADO</div>
        
        <div id="floating-controls">
            <div class="float-slider-container">
                <span style="font-size: 14px;">Letra:</span>
                <input type="range" id="float-font-slider" min="40" max="150" value="80" style="width: 70px;">
            </div>

            <div class="float-slider-container">
                <span style="font-size: 14px;">Veloc:</span>
                <input type="range" id="float-speed-slider" min="50" max="300" value="130" style="width: 80px;">
                <span id="float-speed-display" class="slider-display" style="width: 35px; font-size: 14px;">130</span>
            </div>
            
            <button class="float-btn fs-btn" id="fs-btn" onclick="toggleFullScreen()">Tela Cheia</button>
            <button class="float-btn" onclick="stopTeleprompter()">Voltar</button>
            <button class="float-btn play-btn" id="play-pause-btn" onclick="togglePlay(event)">Play (Toque)</button>
        </div>

        <button id="eye-btn" onclick="toggleUI()" title="Ocultar Comandos">
            <svg id="eye-icon-open" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
            </svg>
        </button>

        <div id="text-container" onclick="togglePlay(event)"></div>
    </div>

    <script>
        let wordsArray = [];
        let currentIndex = 0;
        let isPlaying = false;
        let intervalId = null;
        let currentPPM = 130;
        let uiVisible = true;
        
        const setupScreen = document.getElementById('setup-screen');
        const prompterScreen = document.getElementById('teleprompter-screen');
        const textContainer = document.getElementById('text-container');
        const playPauseBtn = document.getElementById('play-pause-btn');
        const statusIndicator = document.getElementById('status-indicator');
        const fsBtn = document.getElementById('fs-btn');
        const floatingControls = document.getElementById('floating-controls');
        const eyeBtn = document.getElementById('eye-btn');

        const setupSpeedSlider = document.getElementById('setup-speed-slider');
        const setupSpeedDisplay = document.getElementById('setup-speed-display');
        const floatSpeedSlider = document.getElementById('float-speed-slider');
        const floatSpeedDisplay = document.getElementById('float-speed-display');

        const setupFontSlider = document.getElementById('setup-font-slider');
        const setupFontDisplay = document.getElementById('setup-font-display');
        const floatFontSlider = document.getElementById('float-font-slider');

        function updateSpeed(value) {
            currentPPM = parseInt(value);
            setupSpeedSlider.value = currentPPM;
            setupSpeedDisplay.innerText = currentPPM + " PPM";
            floatSpeedSlider.value = currentPPM;
            floatSpeedDisplay.innerText = currentPPM;

            if (isPlaying) {
                clearInterval(intervalId);
                startInterval();
            }
        }

        function updateFontSize(value) {
            setupFontSlider.value = value;
            setupFontDisplay.innerText = value + "px";
            floatFontSlider.value = value;
            textContainer.style.fontSize = value + "px";
            
            if (currentIndex > 0) {
                const targetWord = document.getElementById(`word-${currentIndex}`);
                if (targetWord) targetWord.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        setupSpeedSlider.addEventListener('input', (e) => updateSpeed(e.target.value));
        floatSpeedSlider.addEventListener('input', (e) => updateSpeed(e.target.value));
        setupFontSlider.addEventListener('input', (e) => updateFontSize(e.target.value));
        floatFontSlider.addEventListener('input', (e) => updateFontSize(e.target.value));

        function startTeleprompter() {
            const rawText = document.getElementById('input-text').value.trim();
            const mirrorX = document.getElementById('mirror-x').checked;
            const mirrorY = document.getElementById('mirror-y').checked;
            
            if (!rawText) {
                alert("Por favor, insira um texto.");
                return;
            }

            textContainer.className = '';
            
            if (mirrorX && mirrorY) {
                textContainer.classList.add('mirror-xy');
            } else if (mirrorX) {
                textContainer.classList.add('mirror-x');
            } else if (mirrorY) {
                textContainer.classList.add('mirror-y');
            }

            textContainer.innerHTML = '';
            wordsArray = rawText.split(/\s+/).filter(word => word.length > 0);
            
            wordsArray.forEach((word, index) => {
                const span = document.createElement('span');
                span.className = 'word';
                span.id = `word-${index}`;
                span.innerText = word;
                textContainer.appendChild(span);
                textContainer.appendChild(document.createTextNode(' '));
            });

            setupScreen.style.display = 'none';
            prompterScreen.style.display = 'block';
            
            currentIndex = 0;
            isPlaying = false;
            updatePlayBtnUI();
            updateFontSize(setupFontSlider.value);
            
            // Força a barra de rolagem a voltar para o topo ao iniciar
            prompterScreen.scrollTop = 0;
            
            setTimeout(() => {
                highlightWord(0);
            }, 100);
        }

        function stopTeleprompter() {
            pauseTeleprompter();
            prompterScreen.style.display = 'none';
            setupScreen.style.display = 'flex';
            if (document.fullscreenElement || document.webkitFullscreenElement) {
                exitFullScreen();
            }
        }

        function togglePlay(event) {
            if (event) event.stopPropagation(); 
            
            if (currentIndex >= wordsArray.length) {
                currentIndex = 0;
                highlightWord(0);
            }
            if (isPlaying) pauseTeleprompter();
            else playTeleprompter();
        }

        function playTeleprompter() {
            if (currentIndex >= wordsArray.length) return;
            isPlaying = true;
            updatePlayBtnUI();
            startInterval();
        }

        function startInterval() {
            const msPerWord = 60000 / currentPPM;
            intervalId = setInterval(() => {
                if (currentIndex < wordsArray.length - 1) {
                    currentIndex++;
                    highlightWord(currentIndex);
                } else {
                    pauseTeleprompter();
                    statusIndicator.innerText = "FIM";
                }
            }, msPerWord);
        }

        function pauseTeleprompter() {
            isPlaying = false;
            clearInterval(intervalId);
            updatePlayBtnUI();
        }

        function updatePlayBtnUI() {
            if (isPlaying) {
                playPauseBtn.innerText = "Pause";
                playPauseBtn.style.backgroundColor = "#b91c1c";
                playPauseBtn.style.borderColor = "#991b1b";
                statusIndicator.innerText = "GRAVANDO...";
                statusIndicator.style.color = "#ef4444";
            } else {
                playPauseBtn.innerText = "Play";
                playPauseBtn.style.backgroundColor = "#059669";
                playPauseBtn.style.borderColor = "#047857";
                statusIndicator.innerText = "PAUSADO";
                statusIndicator.style.color = "#fbbf24";
            }
        }

        function highlightWord(index) {
            const allWords = document.querySelectorAll('.word');
            allWords.forEach((el, i) => {
                el.classList.remove('active');
                if (i < index) el.classList.add('read');
                else el.classList.remove('read');
            });

            const targetWord = document.getElementById(`word-${index}`);
            if (targetWord) {
                targetWord.classList.add('active');
                targetWord.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function toggleUI() {
            uiVisible = !uiVisible;
            if (uiVisible) {
                floatingControls.classList.remove('ui-hidden');
                statusIndicator.classList.remove('ui-hidden');
                eyeBtn.classList.remove('eye-dimmed');
            } else {
                floatingControls.classList.add('ui-hidden');
                statusIndicator.classList.add('ui-hidden');
                eyeBtn.classList.add('eye-dimmed');
            }
        }

        function toggleFullScreen() {
            const doc = document.documentElement;
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (doc.requestFullscreen) {
                    doc.requestFullscreen().catch(err => console.log(err));
                } else if (doc.webkitRequestFullscreen) {
                    doc.webkitRequestFullscreen();
                } else {
                    alert("Seu navegador limita a tela cheia. No iPhone, use o Safari e clique em 'Adicionar à Tela de Início'.");
                }
            } else {
                exitFullScreen();
            }
        }

        function exitFullScreen() {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            }
        }

        document.addEventListener('fullscreenchange', handleFSChange);
        document.addEventListener('webkitfullscreenchange', handleFSChange);

        function handleFSChange() {
            if (document.fullscreenElement || document.webkitFullscreenElement) {
                fsBtn.innerText = "Sair Tela Cheia";
                fsBtn.style.backgroundColor = "#4f46e5";
            } else {
                fsBtn.innerText = "Tela Cheia";
                fsBtn.style.backgroundColor = "#6366f1";
            }
        }

        document.addEventListener('keydown', (event) => {
            if (prompterScreen.style.display === 'block') {
                if (event.code === 'Space') {
                    event.preventDefault();
                    togglePlay();
                } else if (event.code === 'Escape') {
                    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                        stopTeleprompter();
                    }
                }
            }
        });
    </script>
</body>
</html>
